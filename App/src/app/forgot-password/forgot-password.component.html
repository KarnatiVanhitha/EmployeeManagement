<div class="container-fluid vh-100 d-flex justify-content-center align-items-center bg-light">

    <div class="card shadow-lg border-0 rounded-4 p-4" style="width:420px;">

        <h3 class="text-center fw-bold mb-3">
            Forgot Password
        </h3>

        <p class="text-center text-muted mb-4">
            Enter your registered email address.
        </p>

        <form (ngSubmit)="verifyEmail()">

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    [class.is-invalid]="emailerror"
                    placeholder="Enter Email"
                    [(ngModel)]="email"
                    name="email">
                <div class="field-error" *ngIf="emailerror">
                    <i class="bi bi-exclamation-circle-fill"></i> {{ emailerror }}
                </div>
                <div class="text-success mt-2 small fw-semibold" *ngIf="successMessage">
                    <i class="bi bi-check-circle-fill"></i> {{ successMessage }}
                </div>

            </div>

            <button
                class="btn btn-primary w-100"
                type="submit">

                Continue

            </button>

        </form>

        <div class="text-center mt-3">

            <a
                routerLink="/Admin-login"
                class="text-decoration-none">

                Back to Login

            </a>

        </div>

    </div>

</div>
