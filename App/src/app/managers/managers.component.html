<div class="container-fluid py-4">
  <div class="mb-4">
    <h3 class="fw-bold mb-1">Department Managers</h3>
    <p class="text-muted mb-0">Managers by department</p>
  </div>

  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <input
            type="search"
            class="form-control"
            placeholder="Search department, manager, or email"
            [(ngModel)]="searchText">
        </div>
      </div>
    </div>
  </div>

  <div
    class="card shadow-sm border-0"
    *ngIf="filteredManagers().length === 0">
    <div class="card-body text-center py-5">
      <i class="bi bi-person-x fs-1 text-secondary"></i>
      <h4 class="mt-3">No department managers found</h4>
    </div>
  </div>

  <div class="row g-4">
    <div
      class="col-lg-4 col-md-6"
      *ngFor="let manager of filteredManagers()">
      <div
        class="card shadow-sm border-0 h-100"
        [class.current-employee-department]="isCurrentEmployeeDepartment(manager)">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">
            {{ manager.DepartmentName || manager.departmentName || manager.TeamName || manager.teamName }}
          </h5>
          <span
            class="badge bg-primary ms-2 text-white your-department-badge"
            *ngIf="isCurrentEmployeeDepartment(manager)">
            Your Department
          </span>
        </div>

        <div class="card-body">
          <h5 class="mb-1">
            {{ manager.ManagerName || manager.FullName || manager.managerName }}
          </h5>
          <a
            class="text-muted text-decoration-none"
            [href]="'mailto:' + (manager.Email || manager.email)">
            {{ manager.Email || manager.email }}
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
