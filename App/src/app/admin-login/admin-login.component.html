<div class="container-fluid vh-100 d-flex flex-column justify-content-center align-items-center bg-light">

  <!-- TITLE -->
  <h1 class="text-center fw-semibold mb-4 text-secondary title">
    Welcome Back, Administrator
  </h1>

  <!-- LOGIN CARD -->
  <div class="card shadow-lg border-0 rounded-3 p-4 login-card">

    <!-- SUBTITLE -->
    <p class="text-center text-muted fw-medium mb-4 subtitle">
      Access your school management portal<br>
      and manage all operations securely
    </p>

    <!-- FORM -->
<form (ngSubmit)="adminLogin()">
   <div class="field-error mb-2" *ngIf="loginError">
    <i class="bi bi-exclamation-circle-fill"></i> {{ loginError }}
   </div>

<div class="mb-3">

  <input
    type="text"
    class="form-control"
    [class.is-invalid]="emailError"
    placeholder="Enter Email"
    [(ngModel)]="email"
    name="email">

  <div class="field-error" *ngIf="emailError">
    <i class="bi bi-exclamation-circle-fill"></i> {{ emailError }}
  </div>

</div>

<div class="mb-3">

  <input
    type="password"
    class="form-control"
    [class.is-invalid]="passwordError"
    placeholder="Enter Password"
    [(ngModel)]="password"
    name="password">

  <div class="field-error" *ngIf="passwordError">
    <i class="bi bi-exclamation-circle-fill"></i> {{ passwordError }}
  </div>

</div>
  <!-- Forgot Password -->
  <div class="text-end mb-1">
    <a
      [routerLink]="['/forgot-password']"
      class="text-decoration-none fw-semibold small forgot-link" (click)="forgot()">
      Forgot Password?
    </a>
  </div>

  <button
    type="submit"
    class="w-100 fw-bold Login-btn fern-button-white-text">
    Login
  </button>
   <small
    class="text-success error-text"
    [style.visibility]="loginSuccess ? 'visible' : 'hidden'">
    {{ loginSuccess || 'Login successful!' }}
  </small>


</form>

    <p class="text-center mt-3 small text-muted">
      Back to
      <a routerLink="/" class="fw-bold text-decoration-none Signin-a">
        User Login
      </a>
    </p>

  </div>

</div>
