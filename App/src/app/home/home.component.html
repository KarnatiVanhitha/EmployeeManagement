<div class="layout">

  <!-- MOBILE/TABLET TOPBAR -->
  <div class="mobile-topbar d-lg-none">

    <button
      class="menu-btn"
      type="button"
      (click)="isSidebarOpen = !isSidebarOpen"
    >
      <i class="bi bi-list"></i>
    </button>

    <a class="account-profile-link" routerLink="/home/settings" aria-label="Open settings and profile">
      <img *ngIf="profileImage" [src]="profileImage" alt="" class="account-profile-image">
      <i *ngIf="!profileImage" class="bi bi-person-circle account-profile-placeholder" aria-hidden="true"></i>
    </a>

  </div>

  <!-- SIDEBAR -->
  <div
    class="sidebar-wrapper"
    [class.show-sidebar]="isSidebarOpen"
  >

    <app-sidebar></app-sidebar>

  </div>

  <!-- OVERLAY -->
  <div
    class="overlay"
    *ngIf="isSidebarOpen"
    (click)="isSidebarOpen = false"
  ></div>

  <!-- MAIN -->
  <div class="main">

    <header class="account-bar d-none d-lg-flex">
      <a class="account-profile-link" routerLink="/home/settings">
        <img *ngIf="profileImage" [src]="profileImage" alt="" class="account-profile-image">
        <i *ngIf="!profileImage" class="bi bi-person-circle account-profile-placeholder" aria-hidden="true"></i>
        <span>{{ profileName || 'Profile' }}</span>
      </a>
    </header>

    <div class="content">
      <router-outlet></router-outlet>
    </div>

  </div>

  <div class="ask-me-widget">
    <section class="ask-me-panel" *ngIf="isAskMeOpen" id="ask-me-panel" role="status">
      <p class="ask-me-panel-title">Ask me</p>
      <p class="ask-me-panel-message">Your assistant is coming soon.</p>
    </section>
    <button
      class="ask-me-button"
      type="button"
      aria-controls="ask-me-panel"
      [attr.aria-expanded]="isAskMeOpen"
      (click)="isAskMeOpen = !isAskMeOpen">
      <i class="bi bi-chat-dots-fill" aria-hidden="true"></i>
      <span>Ask me</span>
    </button>
  </div>

</div>
