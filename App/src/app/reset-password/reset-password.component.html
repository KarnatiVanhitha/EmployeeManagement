<div class="container-fluid vh-100 d-flex justify-content-center align-items-center bg-light">

    <div class="card shadow-lg border-0 rounded-4 p-4" style="width:430px;">

        <h3 class="text-center fw-bold mb-3">
            Reset Password
        </h3>

        <p class="text-center text-muted mb-4">
            Enter your new password.
        </p>

        <form (ngSubmit)="resetPassword()">

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    New Password
                </label>

                <div class="password-input-wrap">
                    <input
                        [type]="showNewPassword ? 'text' : 'password'"
                        class="form-control"
                        [class.is-invalid]="newPasswordError"
                        [(ngModel)]="newPassword"
                        name="newPassword"
                        placeholder="Enter New Password">
                    <button type="button" class="password-toggle" (click)="showNewPassword = !showNewPassword"
                            [attr.aria-label]="showNewPassword ? 'Hide password' : 'Show password'">
                        <i class="bi" [ngClass]="showNewPassword ? 'bi-eye-slash' : 'bi-eye'" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="field-error" *ngIf="newPasswordError">
                    <i class="bi bi-exclamation-circle-fill"></i> {{ newPasswordError }}
                </div>

            </div>

            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Confirm Password
                </label>

                <div class="password-input-wrap">
                    <input
                        [type]="showConfirmPassword ? 'text' : 'password'"
                        class="form-control"
                        [class.is-invalid]="confirmPasswordError"
                        [(ngModel)]="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm Password">
                    <button type="button" class="password-toggle" (click)="showConfirmPassword = !showConfirmPassword"
                            [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
                        <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="field-error" *ngIf="confirmPasswordError">
                    <i class="bi bi-exclamation-circle-fill"></i> {{ confirmPasswordError }}
                </div>

            </div>

            <button
                class="btn btn-primary w-100"
                type="submit">

                Reset Password

            </button>

        </form>

    </div>

</div>
